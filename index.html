<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="stylesheet" href="uPlot.min.css" />
        <link rel="stylesheet" href="style.css" />
        <script src="uPlot.iife.min.js" defer></script>
        <script src="main.js" defer></script>
        <title>Finances Perso</title>
    </head>

    <body>
        <h1>Calcul de la valeur future</h1>

        <label for="present_value">Valeur Présente (€)</label>
        <input type="number" name="present_value" id="present_value"/><br><br>

        <label for="period">Nombre de périodes</label>
        <input type="number" name="period" id="period"/><br><br>

        <label for="interest">Intérêt (%)</label>
        <input type="number" name="interest" id="interest"/><br><br>

        <button id="calcul">VALIDER</button>
        <br><br>

        <h2>Résultat</h2>
        <div id="result"></div>
        <br><br>

        <h2>Détail</h2>
        <div id="tab"></div>

        <h2>Graphe</h2>
        <div id="futureValueChart" aria-label="Évolution du capital et des intérêts par période"></div>
        
    </body>

</html>
